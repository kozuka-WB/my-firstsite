<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo">Portfolio</div>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#works">Works</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1 class="mainvisual">Main Visual</h1>
        </section>

        <section class="About" id="about">
            <h2>About</h2>
            <img src="images/Screenshot.png" alt="プロフィール画像" class="profile-image">
            <p class="name">小塚 優</p>
            <p class="bunsyou">ゆる〜くのんびりと頑張りすぎないように</p>
        </section>

        <section class="Works" id="works">
            <h2>Works</h2>
            <div class="works-grid">
                <img src="images/among us.png" alt="アモングアス">
                <img src="images/Chair and desk.png" alt="椅子と机">
                <img src="images/glass.png" alt="グラス">
                <img src="images/Rabbit.png" alt="うさぎ">
                <img src="images/capsule.png" alt="カプセル">
                <img src="images/koiru.png" alt="コイル">
                <img src="images/Jam.png" alt="ジャム">
                <img src="images/potato.png" alt="ポテト">
                <img src="images/Battery.png" alt="電池">
            </div>
        </section>

        <section class="Contact" id="contact">
            <h2>Contact</h2>
            
            <div class="status-container">
                <p id="current-status">ステータスを読み込み中...</p>
            </div>

            <ul class="contact-cards">
                <li class="sns-x">
                    <a href="https://x.com/?lang=ja" target="_blank" rel="noopener">
                        <span class="icon">𝕏</span>
                        <span class="label">X (Twitter)</span>
                        <span class="value">@x_mdc_student84592</span>
                    </a>
                </li>

                <li class="sns-insta">
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener">
                        <span class="icon">📸</span>
                        <span class="label">Instagram</span>
                        <span class="value">@insta_mdc_student84592</span>
                    </a>
                </li>

                <li class="sns-email">
                    <a href="mailto:student84592@mdc-vd.com">
                        <span class="icon">📧</span>
                        <span class="label">Email</span>
                        <span class="value">student84592@mdc-vd.com</span>
                    </a>
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2025 FULL NAME</p>
        <p>Want to see more? Send a message!</p>
    </footer>

    <div id="image-modal" class="modal">
        <span class="close-button">&times;</span>
        <img class="modal-content" id="expanded-image">
    </div>

    <script>
document.addEventListener('DOMContentLoaded', function() {
    // スムーズスクロール機能
    document.querySelectorAll('nav a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.getAttribute('href');
            const targetElement = document.querySelector(targetId);
            
            if (targetElement) {
                const headerHeight = document.querySelector('header').offsetHeight;
                const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
                
                window.scrollTo({
                    top: targetPosition,
                    behavior: 'smooth'
                });
            }
        });
    });

    // ステータス表示機能
    const statusElement = document.getElementById('current-status');
    const container = document.querySelector('.status-container');
    
    if (statusElement && container) {
        function updateStatus() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const hour = now.getHours();
            
            const startHour = 10;
            const endHour = 18;
            
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;
            const isWorkingHours = hour >= startHour && hour < endHour;
            
            let message = '';
            
            if (isWeekday && isWorkingHours) {
                message = `💻 NOW: 作業時間内です。ご連絡は通常2時間以内に確認します！`;
                container.classList.remove('off-hours');
            } else if (isWeekday) {
                message = `🌙 NOW: 作業時間外です。緊急でない限り、翌営業日の午前10時以降に確認します。`;
                container.classList.add('off-hours');
            } else {
                message = `🏝️ NOW: 週末のため休止中です。お問い合わせは月曜に確認します！`;
                container.classList.add('off-hours');
            }
            
            statusElement.textContent = message;
        }
        
        updateStatus();
        setInterval(updateStatus, 60000);
    }

    // モーダル機能
    const modal = document.getElementById('image-modal');
    const expandedImg = document.getElementById('expanded-image');
    const images = document.querySelectorAll('.works-grid img');

    if (modal && expandedImg) {
        images.forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'flex';
                expandedImg.src = img.src;
                document.body.style.overflow = 'hidden';
            });
        });

        modal.addEventListener('click', () => {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        });
    }
});
    </script>
</body>
</html>
